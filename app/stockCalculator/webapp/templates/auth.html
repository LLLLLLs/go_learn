<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{if eq .Mode "register"}}注册{{else}}登录{{end}} - 韭菜培养基地</title>
  <script>
    (() => {
      try {
        const theme = localStorage.getItem("stockcalc-theme");
        if (theme === "dark") document.documentElement.dataset.theme = "dark";
      } catch (error) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-panel">
      <div class="auth-panel-header">
        <div>
          <h1>韭菜培养基地</h1>
          <h2>{{if eq .Mode "register"}}注册账号{{else}}账号登录{{end}}</h2>
        </div>
        <button type="button" class="ghost-button theme-toggle" data-theme-toggle>Light</button>
      </div>
      {{if .Notice.Message}}
        <div class="notice {{.Notice.Type}}">{{.Notice.Message}}</div>
      {{end}}
      <form method="post" action="{{if eq .Mode "register"}}/register{{else}}/login{{end}}" class="auth-form">
        <label>账号<input name="account" value="{{.Account}}" autocomplete="username" required autofocus></label>
        <label>密码<input name="password" type="password" autocomplete="{{if eq .Mode "register"}}new-password{{else}}current-password{{end}}" required></label>
        {{if eq .Mode "register"}}
          <label>重复密码<input name="password_confirm" type="password" autocomplete="new-password" required></label>
          <label>用户名<input name="name" value="{{.Name}}" autocomplete="name" required></label>
        {{end}}
        <button type="submit">{{if eq .Mode "register"}}注册并进入{{else}}登录{{end}}</button>
      </form>
      <p class="auth-switch">
        {{if eq .Mode "register"}}
          已有账号？<a href="/login">去登录</a>
        {{else}}
          没有账号？<a href="/register">注册</a>
        {{end}}
      </p>
    </section>
  </main>
  <script>
    const themeToggles = document.querySelectorAll("[data-theme-toggle]");
    function currentTheme() {
      return document.documentElement.dataset.theme === "dark" ? "dark" : "light";
    }
    function applyTheme(theme) {
      const nextTheme = theme === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = nextTheme === "dark" ? "dark" : "";
      themeToggles.forEach((button) => {
        button.textContent = nextTheme === "dark" ? "Dark" : "Light";
        button.setAttribute("aria-label", nextTheme === "dark" ? "切换到日间模式" : "切换到夜间模式");
      });
      try {
        localStorage.setItem("stockcalc-theme", nextTheme);
      } catch (error) {}
    }
    applyTheme(currentTheme());
    themeToggles.forEach((button) => {
      button.addEventListener("click", () => applyTheme(currentTheme() === "dark" ? "light" : "dark"));
    });
  </script>
</body>
</html>
